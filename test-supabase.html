<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Simple Supabase</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        pre { background: #f0f0f0; padding: 10px; overflow: auto; }
    </style>
</head>
<body>
    <h1>🔌 Test connexion Supabase</h1>
    <div id="result"></div>

    <script>
        // ===== REMPLACE PAR TES VRAIES VALEURS =====
        const SUPABASE_URL = 'https://vskyxicpihysyjmbknur.supabase.co';
        const SUPABASE_ANON_KEY = 'ta-clé-publishable-ici';  // ← À MODIFIER
        // ===========================================

        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = '<p>⏳ Test en cours...</p>';

        async function tester() {
            let html = '';

            // Test 1 : Vérifier si l'URL est accessible
            html += '<h2>Test 1 : Vérification URL</h2>';
            try {
                const response = await fetch(SUPABASE_URL);
                html += `<p class="success">✅ URL accessible : ${SUPABASE_URL}</p>`;
            } catch(e) {
                html += `<p class="error">❌ URL inaccessible : ${e.message}</p>`;
                resultDiv.innerHTML = html;
                return;
            }

            // Test 2 : Tenter de lire les types
            html += '<h2>Test 2 : Lecture table "types"</h2>';
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/types?select=*`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    html += `<p class="success">✅ Table "types" lue avec succès !</p>`;
                    html += `<p>Nombre de types : ${data.length}</p>`;
                    html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    const error = await response.text();
                    html += `<p class="error">❌ Erreur : ${response.status}</p>`;
                    html += `<pre>${error}</pre>`;
                }
            } catch(e) {
                html += `<p class="error">❌ Exception : ${e.message}</p>`;
            }

            // Test 3 : Tenter de lire les projets
            html += '<h2>Test 3 : Lecture table "projets"</h2>';
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/projets?select=*`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    html += `<p class="success">✅ Table "projets" lue avec succès !</p>`;
                    html += `<p>Nombre de projets : ${data.length}</p>`;
                } else {
                    html += `<p class="error">❌ Erreur : ${response.status}</p>`;
                }
            } catch(e) {
                html += `<p class="error">❌ Exception : ${e.message}</p>`;
            }

            resultDiv.innerHTML = html;
        }

        tester();
    </script>
</body>
</html>
