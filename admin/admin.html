<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Admin - UM6P Green Map</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="container" id="app">
        <div style="text-align: center; padding: 50px;">Chargement...</div>
    </div>

    <script>
        // ============================================================
        // CONFIGURATION SUPABASE
        // ============================================================
        const SUPABASE_URL = 'https://vskyxicpihysyjmbknur.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZza3l4aWNwaWh5c3lqbWJrbnVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxODA0MjIsImV4cCI6MjA5NDc1NjQyMn0.qlZD2K0nfJ6ccrcQba8Dj5ZGhgAWPSWHNjscEDhhXsw';
        const SUPABASE_SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZza3l4aWNwaWh5c3lqbWJrbnVyIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3OTE4MDQyMiwiZXhwIjoyMDk0NzU2NDIyfQ.tJ523KHq8l-35W3TZ4QYUP5oGcrQyQr5_Qh67etqmhY';
        
        // ============================================================
        let projets = [];
        let types = [];
        let campusList = [];
        let token = sessionStorage.getItem('adminToken');
        const ADMIN_PASSWORD = 'um6p2024';
        let activeTab = 'projets';

        // ============================================================
        // FONCTIONS SUPABASE
        // ============================================================
        async function supabaseFetch(endpoint, options = {}) {
            const url = `${SUPABASE_URL}/rest/v1/${endpoint}`;
            const response = await fetch(url, {
                ...options,
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    'Content-Type': 'application/json',
                    ...options.headers
                }
            });
            return response;
        }
        
        async function supabaseWrite(endpoint, options = {}) {
            const url = `${SUPABASE_URL}/rest/v1/${endpoint}`;
            const response = await fetch(url, {
                ...options,
                headers: {
                    'apikey': SUPABASE_SERVICE_KEY,
                    'Authorization': `Bearer ${SUPABASE_SERVICE_KEY}`,
                    'Content-Type': 'application/json',
                    ...options.headers
                }
            });
            return response;
        }

        async function uploadToSupabase(file, bucket) {
            const fileName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.-]/g, '_')}`;
            const url = `${SUPABASE_URL}/storage/v1/object/${bucket}/${fileName}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${SUPABASE_SERVICE_KEY}` },
                body: file
            });
            
            if (!response.ok) throw new Error(`Upload failed: ${await response.text()}`);
            
            return `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${fileName}`;
        }

        async function handleImageUpload(inputId, previewId, bucket, urlFieldId) {
            const input = document.getElementById(inputId);
            const preview = document.getElementById(previewId);
            const urlField = document.getElementById(urlFieldId);
            const file = input.files[0];
            if (!file) return;
            
            preview.innerHTML = '<div class="upload-progress">Upload...</div>';
            try {
                const publicUrl = await uploadToSupabase(file, bucket);
                preview.innerHTML = `<img src="${publicUrl}" alt="Preview">`;
                urlField.value = publicUrl;
                if (urlFieldId === 'image') updateImagePreview();
                if (urlFieldId === 'icone') updateIconPreview();
            } catch (error) {
                preview.innerHTML = `<div class="upload-progress" style="color:red;">Erreur</div>`;
            }
        }

        function previewImage(url, previewElementId) {
            const preview = document.getElementById(previewElementId);
            if (url && url.trim()) {
                preview.innerHTML = `<img src="${url}" alt="Preview" onerror="this.parentElement.innerHTML='<span style=color:red>Image non trouvee</span>'">`;
            } else {
                preview.innerHTML = '<span style="color:#999">Aucune image</span>';
            }
        }

        function updateImagePreview() { previewImage(document.getElementById('image').value, 'imagePreview'); }
        function updateIconPreview() { previewImage(document.getElementById('icone').value, 'iconePreview'); }

        // ============================================================
        // CHARGEMENT DES DONNEES
        // ============================================================
        async function chargerDonnees() {
            try {
                const [resTypes, resProjets, resCampus] = await Promise.all([
                    supabaseFetch('types?select=*'),
                    supabaseFetch('projets?select=*'),
                    supabaseFetch('campus?select=*')
                ]);
                
                if (resTypes.ok) types = await resTypes.json();
                if (resProjets.ok) projets = await resProjets.json();
                if (resCampus.ok) campusList = await resCampus.json();
                
                console.log('Types:', types.length, 'Projets:', projets.length, 'Campus:', campusList.length);
                return true;
            } catch (e) {
                console.error(e);
                return false;
            }
        }

        // ============================================================
        // FONCTIONS DE TELECHARGEMENT
        // ============================================================
        function telechargerJSON() {
            const data = {
                projets: projets,
                types: types,
                campus: campusList,
                date_export: new Date().toISOString()
            };
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `um6p_data_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.json`;
            a.click();
            URL.revokeObjectURL(url);
            alert('Telechargement JSON termine !');
        }

        function telechargerCSV() {
            const entetes = ['id', 'nom', 'description', 'latitude', 'longitude', 'type', 'sous_type', 'campus', 'image', 'icone', 'informations_complementaires'];
            const lignes = projets.map(p => [
                p.id || '',
                p.nom || '',
                (p.description || '').replace(/,/g, ';').replace(/\n/g, ' '),
                p.latitude || '',
                p.longitude || '',
                p.type || '',
                p.sous_type || '',
                p.campus || '',
                p.image || '',
                p.icone || '',
                (p.informations_complementaires || '').replace(/,/g, ';').replace(/\n/g, ' ')
            ]);
            
            const csvContent = [entetes, ...lignes].map(row => row.join(',')).join('\n');
            const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `um6p_projets_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            alert('Telechargement CSV termine !');
        }

        function telechargerBackupComplet() {
            telechargerJSON();
        }

        // ============================================================
        // GESTION DES TYPES
        // ============================================================
        async function ajouterType(event) {
            event.preventDefault();
            const form = event.target;
            const nouveauType = { nom: form.typeNom.value, couleur: form.typeCouleur.value || '#01568b' };
            
            const response = await supabaseWrite('types', { method: 'POST', body: JSON.stringify(nouveauType) });
            if (response.ok) {
                alert('Type ajoute !');
                form.reset();
                await chargerDonnees();
                afficherInterface();
            } else { alert('Erreur'); }
        }

        async function modifierType(id, nouveauNom, nouvelleCouleur) {
            const response = await supabaseWrite(`types?id=eq.${id}`, {
                method: 'PATCH',
                body: JSON.stringify({ nom: nouveauNom, couleur: nouvelleCouleur })
            });
            if (response.ok) {
                alert('Type modifie !');
                await chargerDonnees();
                afficherInterface();
            }
        }

        async function supprimerType(id) {
            if (!confirm('Supprimer ce type ?')) return;
            const response = await supabaseWrite(`types?id=eq.${id}`, { method: 'DELETE' });
            if (response.ok) {
                alert('Type supprime');
                await chargerDonnees();
                afficherInterface();
            }
        }

        // ============================================================
        // GESTION DES CAMPUS
        // ============================================================
        async function ajouterCampus(event) {
            event.preventDefault();
            const nouveauCampus = {
                nom: document.getElementById('campusNom').value,
                slug: document.getElementById('campusNom').value.toLowerCase().replace(/ /g, '-').replace(/[éèêë]/g, 'e').replace(/[àâ]/g, 'a'),
                couleur: document.getElementById('campusCouleur').value,
                latitude: parseFloat(document.getElementById('campusLat').value),
                longitude: parseFloat(document.getElementById('campusLng').value),
                zoom: parseInt(document.getElementById('campusZoom').value)
            };
            
            const response = await supabaseWrite('campus', { method: 'POST', body: JSON.stringify(nouveauCampus) });
            if (response.ok) {
                alert('Campus ajouté !');
                document.getElementById('campusForm').reset();
                await chargerDonnees();
                afficherInterface();
                if (window.rafraichirMenuCampus) window.rafraichirMenuCampus();
            } else {
                alert('Erreur lors de l\'ajout');
            }
        }

        async function supprimerCampus(id) {
            if (!confirm('Supprimer ce campus ?')) return;
            const response = await supabaseWrite(`campus?id=eq.${id}`, { method: 'DELETE' });
            if (response.ok) {
                alert('Campus supprimé');
                await chargerDonnees();
                afficherInterface();
                if (window.rafraichirMenuCampus) window.rafraichirMenuCampus();
            } else {
                alert('Erreur lors de la suppression');
            }
        }

        // ============================================================
        // CRUD PROJETS
        // ============================================================
        async function ajouterOuModifierProjet(event) {
            event.preventDefault();
            const form = event.target;
            
            const projet = {
                id: form.id.value,
                nom: form.nom.value,
                description: form.description.value,
                latitude: parseFloat(form.latitude.value),
                longitude: parseFloat(form.longitude.value),
                type: form.type.value,
                sous_type: form.sous_type.value,
                campus: form.campus.value,
                image: form.image.value || '',
                icone: form.icone.value || '',
                informations_complementaires: form.infos.value || ''
            };

            const existing = projets.find(p => p.id === projet.id);
            let response;
            if (existing) {
                response = await supabaseWrite(`projets?id=eq.${projet.id}`, { method: 'PATCH', body: JSON.stringify(projet) });
            } else {
                response = await supabaseWrite('projets', { method: 'POST', body: JSON.stringify(projet) });
            }

            if (response.ok) {
                alert('Projet enregistre !');
                form.reset();
                document.getElementById('saveBtn').textContent = 'Enregistrer';
                document.getElementById('id').readOnly = false;
                document.getElementById('imagePreview').innerHTML = '';
                document.getElementById('iconePreview').innerHTML = '';
                await chargerDonnees();
                afficherInterface();
            } else {
                const error = await response.text();
                alert('Erreur: ' + error);
            }
        }

        async function supprimerProjet(id) {
            if (!confirm('Supprimer ce projet ?')) return;
            const response = await supabaseWrite(`projets?id=eq.${id}`, { method: 'DELETE' });
            if (response.ok) {
                alert('Projet supprime');
                await chargerDonnees();
                afficherInterface();
            }
        }

        function editerProjet(projet) {
            const form = document.getElementById('projetForm');
            if (form) {
                form.id.value = projet.id;
                form.id.readOnly = true;
                form.nom.value = projet.nom || '';
                form.description.value = projet.description || '';
                form.latitude.value = projet.latitude;
                form.longitude.value = projet.longitude;
                form.type.value = projet.type;
                form.sous_type.value = projet.sous_type || '';
                form.campus.value = projet.campus;
                form.image.value = projet.image || '';
                form.icone.value = projet.icone || '';
                form.infos.value = projet.informations_complementaires || '';
                previewImage(projet.image, 'imagePreview');
                previewImage(projet.icone, 'iconePreview');
                document.getElementById('saveBtn').textContent = 'Modifier';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function resetForm() {
            const form = document.getElementById('projetForm');
            if (form) {
                form.reset();
                form.id.readOnly = false;
                document.getElementById('saveBtn').textContent = 'Enregistrer';
                document.getElementById('imagePreview').innerHTML = '';
                document.getElementById('iconePreview').innerHTML = '';
                document.getElementById('imageFile').value = '';
                document.getElementById('iconeFile').value = '';
            }
        }

        // ============================================================
        // SAUVEGARDER COULEURS
        // ============================================================
        async function sauvegarderCouleurs() {
            for (const type of types) {
                const input = document.getElementById(`color_${type.nom}`);
                if (input && input.value !== type.couleur) {
                    const response = await supabaseWrite(`types?id=eq.${type.id}`, {
                        method: 'PATCH',
                        body: JSON.stringify({ couleur: input.value })
                    });
                    if (!response.ok) {
                        alert(`Erreur lors de la sauvegarde de ${type.nom}`);
                        return;
                    }
                }
            }
            alert('Couleurs sauvegardees !');
            await chargerDonnees();
            afficherInterface();
        }

        // ============================================================
        // AFFICHAGE INTERFACE
        // ============================================================
        function setTab(tabName) {
            activeTab = tabName;
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            document.getElementById(`btn-${tabName}`).classList.add('active');
        }

        function afficherInterface() {
            const typesOptions = types.map(t => `<option value="${t.nom}">${t.nom}</option>`).join('');
            const campusOptions = campusList.length > 0 
                ? campusList.map(c => `<option value="${c.nom}">${c.nom}</option>`).join('')
                : '<option value="">Chargement des campus...</option>';

            document.getElementById('app').innerHTML = `
                <h1>Administration Green Map</h1>
                
                <div class="info-bar">
                    <span> Connexion: Supabase<br> Projets: ${projets.length} | Types: ${types.length} | Campus: ${campusList.length}</span>
                    <div class="download-buttons">
                        <button class="btn-download" onclick="telechargerJSON()">Exporter JSON</button>
                        <button class="btn-download" onclick="telechargerCSV()">Exporter CSV</button>
                        <button class="btn-download" onclick="telechargerBackupComplet()">Backup complet</button>
                    </div>
                </div>
                
                <div class="tab-buttons">
                    <button class="tab-btn ${activeTab === 'projets' ? 'active' : ''}" id="btn-projets" onclick="setTab('projets')">Projets</button>
                    <button class="tab-btn ${activeTab === 'types' ? 'active' : ''}" id="btn-types" onclick="setTab('types')">Types & Couleurs</button>
                    <button class="tab-btn ${activeTab === 'campus' ? 'active' : ''}" id="btn-campus" onclick="setTab('campus')">Campus</button>
                </div>
                
                <!-- ==================== TAB PROJETS ==================== -->
                <div id="tab-projets" class="tab-content ${activeTab === 'projets' ? 'active' : ''}">
                    <div class="card">
                        <h2>Formulaire projet</h2>
                        <form id="projetForm" onsubmit="ajouterOuModifierProjet(event)">
                            <div class="row-2cols">
                                <div class="col">
                                    <div class="form-group"><label>ID *</label><input type="text" id="id" required placeholder="BG-001"></div>
                                    <div class="form-group"><label>Nom</label><input type="text" id="nom" placeholder="Nom du projet"></div>
                                    <div class="form-group"><label>Latitude *</label><input type="number" step="any" id="latitude" required placeholder="32.218068"></div>
                                    <div class="form-group"><label>Longitude *</label><input type="number" step="any" id="longitude" required placeholder="-7.936605"></div>
                                    <div class="form-group"><label>Type</label><select id="type">${typesOptions}</select></div>
                                    <div class="form-group"><label>Campus</label><select id="campus">${campusOptions}</select></div>
                                </div>
                                <div class="col">
                                    <div class="form-group">
                                        <label>IMAGE</label>
                                        <input type="file" id="imageFile" accept="image/*" onchange="handleImageUpload('imageFile', 'imagePreview', 'images', 'image')">
                                        <input type="text" id="image" placeholder="URL" onchange="updateImagePreview()">
                                        <div id="imagePreview" class="image-preview"></div>
                                    </div>
                                    <div class="form-group">
                                        <label>ICONE</label>
                                        <input type="file" id="iconeFile" accept="image/*" onchange="handleImageUpload('iconeFile', 'iconePreview', 'icons', 'icone')">
                                        <input type="text" id="icone" placeholder="URL" onchange="updateIconPreview()">
                                        <div id="iconePreview" class="image-preview"></div>
                                    </div>
                                    <div class="form-group"><label>Sous-type</label><input type="text" id="sous_type" placeholder="ex: Insect Shelter"></div>
                                </div>
                            </div>
                            <div class="form-group"><label>Description</label><textarea id="description" rows="3" placeholder="Description..."></textarea></div>
                            <div class="form-group"><label>Infos complementaires</label><textarea id="infos" rows="2" placeholder="Infos supplementaires..."></textarea></div>
                            <button type="submit" id="saveBtn">Enregistrer</button>
                            <button type="button" onclick="resetForm()" style="background:#999">Nouveau</button>
                        </form>
                    </div>
                    <div class="card">
                        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 15px;">
                            <h2 style="margin-bottom: 0;">Liste des projets (${projets.length})</h2>
                        </div>
                        ${projets.length === 0 ? '<p>Aucun projet.</p>' : `
                            <table>
                                <thead>
                                    <tr><th>ID</th><th>Nom</th><th>Campus</th><th>Type</th><th>Actions</th></tr>
                                </thead>
                                <tbody>${projets.map(p => `
                                    <tr>
                                        <td>${p.id}${p.nom ? '' : ' *'}</td>
                                        <td>${p.nom || 'Sans nom'}${p.nom ? '' : ' *'}</td>
                                        <td>${p.campus || '-'}</td>
                                        <td>${p.type || '-'}</td>
                                        <td><button class="btn-edit" onclick='editerProjet(${JSON.stringify(p).replace(/'/g, "&#39;")})'>✏️</button>
                                        <button class="btn-delete" onclick="supprimerProjet('${p.id}')">🗑️</button></td>
                                    </tr>
                                `).join('')}</tbody>
                            </table>
                        `}
                    </div>
                </div>
                
                <!-- ==================== TAB TYPES & COULEURS ==================== -->
                <div id="tab-types" class="tab-content ${activeTab === 'types' ? 'active' : ''}">
                    <div class="card">
                        <h2>Ajouter un type</h2>
                        <form onsubmit="ajouterType(event)">
                            <div class="row-2cols">
                                <div class="col"><div class="form-group"><label>Nom du type</label><input type="text" name="typeNom" required></div></div>
                                <div class="col"><div class="form-group"><label>Couleur</label><input type="color" name="typeCouleur" value="#01568b"></div></div>
                            </div>
                            <button type="submit">Ajouter</button>
                        </form>
                    </div>
                    <div class="card">
                        <h2>Liste des types (${types.length})</h2>
                        ${types.length === 0 ? '<p>Aucun type.</p>' : types.map(t => `
                            <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px; padding:10px; background:#f5f8fa; border-radius:10px;">
                                <span style="width:150px"><strong>${t.nom}</strong></span>
                                <input type="color" value="${t.couleur || '#01568b'}" id="color_${t.nom}" style="width:60px;">
                                <span style="background:${t.couleur || '#01568b'}; width:30px; height:30px; border-radius:8px;"></span>
                                <button class="btn-edit" onclick="modifierType(${t.id}, prompt('Nouveau nom:', '${t.nom}'), document.getElementById('color_${t.nom}').value)">Modifier</button>
                                <button class="btn-delete" onclick="supprimerType(${t.id})">Supprimer</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
                
                <!-- ==================== TAB CAMPUS ==================== -->
                <div id="tab-campus" class="tab-content ${activeTab === 'campus' ? 'active' : ''}">
                    <div class="card">
                        <h2>Ajouter un campus</h2>
                        <form id="campusForm" onsubmit="ajouterCampus(event)">
                            <div class="row-2cols">
                                <div class="col">
                                    <div class="form-group"><label>Nom du campus</label><input type="text" id="campusNom" required></div>
                                    <div class="form-group"><label>Couleur</label><input type="color" id="campusCouleur" value="#01568b"></div>
                                </div>
                                <div class="col">
                                    <div class="form-group"><label>Latitude</label><input type="number" step="any" id="campusLat" required placeholder="32.215818"></div>
                                    <div class="form-group"><label>Longitude</label><input type="number" step="any" id="campusLng" required placeholder="-7.939408"></div>
                                    <div class="form-group"><label>Zoom</label><input type="number" id="campusZoom" value="15"></div>
                                </div>
                            </div>
                            <button type="submit">Ajouter le campus</button>
                        </form>
                    </div>
                    <div class="card">
                        <h2>Liste des campus (${campusList.length})</h2>
                        ${campusList.length === 0 ? '<p>Aucun campus.</p>' : campusList.map(c => `
                            <div class="campus-item">
                                <span style="width:150px"><strong>${c.nom}</strong></span>
                                <span style="background:${c.couleur}; width:30px; height:30px; border-radius:8px;"></span>
                                <span>Lat: ${c.latitude}, Lng: ${c.longitude}, Zoom: ${c.zoom}</span>
                                <button class="btn-delete" onclick="supprimerCampus(${c.id})">Supprimer</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
                
                <button onclick="deconnexion()" style="background:#999; margin-top:20px">Deconnexion</button>
            `;
        }

        async function login() {
            const password = prompt('Entrez le mot de passe admin:');
            if (password === ADMIN_PASSWORD) {
                sessionStorage.setItem('adminToken', password);
                token = password;
                loadApp();
            } else { alert('Mot de passe incorrect'); }
        }

        function deconnexion() {
            sessionStorage.removeItem('adminToken');
            token = null;
            loadApp();
        }

        async function loadApp() {
            if (!token) {
                document.getElementById('app').innerHTML = `<div class="login-box card"><h2>Admin Green Map</h2><button onclick="login()">Se connecter</button></div>`;
                return;
            }
            const success = await chargerDonnees();
            if (success) { 
                window.telechargerJSON = telechargerJSON;
                window.telechargerCSV = telechargerCSV;
                window.telechargerBackupComplet = telechargerBackupComplet;
                window.ajouterCampus = ajouterCampus;
                window.supprimerCampus = supprimerCampus;
                afficherInterface(); 
            }
            else {
                document.getElementById('app').innerHTML = `<div class="card" style="color:red;"><h2>Erreur de connexion a Supabase</h2><button onclick="loadApp()">Reessayer</button><button onclick="deconnexion()">Reconnecter</button></div>`;
            }
        }

        loadApp();
    </script>
</body>
</html>
