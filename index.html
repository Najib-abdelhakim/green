<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>UM6P Green Map</title>
    
    <!-- ==================== SÉCURITÉS ==================== -->
    <!-- 1. Empêche l'exécution de faux fichiers (virus déguisé en image) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    
    <!-- 2. Bloque les injections de scripts malveillants (XSS) -->
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    
    <!-- 3. Protège les infos envoyées aux autres sites (pas d'URL complète) -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <!-- 4. Bloque les fonctions navigateur inutiles (caméra, micro, paiement, USB) -->
    <meta http-equiv="Permissions-Policy" content="geolocation=(self), microphone=(), camera=(), payment=(), usb=()">
    
    <!-- 5. Contrôle total des ressources autorisées (CSP) -->
    <!-- frame-ancestors autorise l'intégration en iframe sur um6p.com et ses sous-domaines -->
    <!-- X-Frame-Options a été SUPPRIMÉ car il bloque toutes les iframes (même les autorisées) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://tile.openstreetmap.org https://mt1.google.com https://mt2.google.com https://mt3.google.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'self' https://um6p.com https://*.um6p.ma;">
    <!-- =================================================== -->

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <div class="map-container">
        <div id="map"></div>
        <div class="campus-controls" id="campusControls"></div>
    </div>
    
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Green Map</h2>
            <button class="toggle-sidebar" id="toggleSidebar">⇤</button>
        </div>
        
        <div class="stats-banner">
            <span>Projets: <span id="projetCount">0</span></span>
            <span><span id="campusName">All</span></span>
        </div>
        
        <div class="filters-section">
            <div class="filters-title">Thematic</div>
            <div class="types-filters" id="typesFilters"></div>
        </div>
        
        <div class="sous-types-section">
            <div class="filters-title">Projet</div>
            <div class="sous-types-list" id="sousTypesList"></div>
        </div>
        
        <div class="trajets-section" id="trajetsSection"></div>
        
        <div class="reset-card">
            <button class="reset-btn" id="resetFilters">Reset</button>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data/projets.js"></script>
<script src="data/trajets.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/popup.js"></script>
<script src="js/markers.js"></script>
<script src="js/modal.js"></script>
<script src="js/trajets.js"></script>
<script src="js/filters.js"></script>
<script src="js/campus.js"></script>
<script src="js/map.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/app.js"></script>
</body>
</html>
