<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>UM6P Green Map</title>
    
    <!-- Sécurités -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <div class="map-container">
        <div id="map"></div>
        <div class="campus-controls" id="campusControls"></div>
    </div>
    
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Green Map</h2>
            <button class="toggle-sidebar" id="toggleSidebar">⇤</button>
        </div>
        
        <div class="stats-banner">
            <span>Projets: <span id="projetCount">0</span></span>
            <span><span id="campusName">All</span></span>
        </div>
        
        <div class="filters-section">
            <div class="filters-title">Thematic</div>
            <div class="types-filters" id="typesFilters"></div>
        </div>
        
        <div class="sous-types-section">
            <div class="filters-title">Projet</div>
            <div class="sous-types-list" id="sousTypesList"></div>
        </div>
        
        <div class="trajets-section" id="trajetsSection"></div>
        
        <div class="reset-card">
            <button class="reset-btn" id="resetFilters">Reset</button>
        </div>
    </div>
</div>

<!-- ========== SCRIPTS (ORDRE CORRIGÉ) ========== -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Configuration et variables globales -->
<script src="js/config.js"></script>
<script src="js/state.js"></script>

<!-- Utilitaires de base -->
<script src="js/utils.js"></script>
<script src="js/popup.js"></script>
<script src="js/markers.js"></script>
<script src="js/modal.js"></script>

<!-- Données des trajets -->
<script src="data/trajets.js"></script>
<script src="js/trajets.js"></script>

<!-- Filtres (après state.js et data) -->
<script src="js/filters.js"></script>

<!-- Campus et carte -->
<script src="js/campus.js"></script>
<script src="js/map.js"></script>
<script src="js/sidebar.js"></script>

<!-- Application et projets (en dernier) -->
<script src="js/app.js"></script>
<script src="js/projets.js"></script>
</body>
</html>
